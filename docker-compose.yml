    image: qsdn-kms-mock
    environment: {CITY: la_spezia, SAE_ID: la_spezia-sae, PORT: "9010"}
    ports: ["9010:9010"]
  kms-padova:
    build: {context: ., dockerfile: services/kms_mock/Dockerfile}
    image: qsdn-kms-mock
    environment: {CITY: padova, SAE_ID: padova-sae, PORT: "9011"}
    ports: ["9011:9011"]

  # Densification: Pavia/Ferrara trusted relays + Verona main KMS.
  kms-pavia:
    build: {context: ., dockerfile: services/kms_mock/Dockerfile}
    image: qsdn-kms-mock
    environment: {CITY: pavia, SAE_ID: pavia-sae, PORT: "9012"}
