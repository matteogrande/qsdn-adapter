# QSDN Southbound Adapter — full stack with the ONOS/Mininet upper layer.
#
#   Mininet (ring) --OpenFlow--> ONOS  ====discovers topology====\
#                                                                 v
#   ONOS REST client -> Northbound API Gateway -> ... internal chain ...
#                          Key Orchestration Manager -> 5..8 simulated KMS
#
# The Topology Manager runs with TOPOLOGY_SOURCE=onos: it pulls devices+links
# from ONOS and maps them to KMS cities via config/onos_mapping.yaml.
#
# Start:  docker compose up --build
# Then:   ./scripts/onos_activate_apps.sh         (enable OpenFlow apps)
#         docker exec -it mininet-c python ring_topology.py   (build the ring)

services:

  # ---- Upper layer: SDN controller + emulated network ----
  # These run only with the "sdn" profile: `docker compose --profile sdn up`.
  # On macOS the SDN layer lives in a Linux VM instead (Mininet needs a real
  # OVS datapath), and the adapter points at it via ONOS_BASE_URL.
  onos:
    image: onosproject/onos            # pin e.g. onosproject/onos:2.7.0 for reproducibility
    platform: linux/amd64              # ONOS ships amd64 only; runs emulated on Apple Silicon
    container_name: onos-c
    profiles: ["sdn"]
    environment:
      ONOS_APPS: "drivers,openflow,fwd,gui2"
    ports: ["8181:8181", "8101:8101", "6653:6653", "5005:5005"]

  mininet:
    image: iwaseyusuke/mininet
    platform: linux/amd64
    container_name: mininet-c
    profiles: ["sdn"]
    tty: true
    privileged: true
    volumes:
      - ./mininet/ring_topology.py:/root/ring_topology.py
      - /lib/modules:/lib/modules
    depends_on: [onos]

  # ---- Horizontal audit log ----
  audit-log:
    build: {context: ., dockerfile: services/audit_log/Dockerfile}
    image: qsdn-audit-log
    environment: {SERVICE_NAME: audit_log}
    volumes: ["audit-data:/app/data"]
    ports: ["8086:8086"]

  # ---- Web dashboard (presentation layer; proxies the adapter REST APIs) ----
  dashboard:
    build: {context: ., dockerfile: services/dashboard/Dockerfile}
    image: qsdn-dashboard
    environment:
      GATEWAY_URL: http://northbound-api-gateway:8080
      TOPOLOGY_URL: http://topology-manager:8082
      AUDIT_URL: http://audit-log:8086
      KMS_REGISTRY: /app/config/kms_registry.yaml
    volumes:
      - "./config:/app/config:ro"
      - "./services/dashboard/app:/app/app:ro"
    ports: ["8090:8090"]
    depends_on: [northbound-api-gateway, topology-manager, audit-log]

  # ---- QKD Southbound Adapter (6 microservices) ----
  northbound-api-gateway:
    build: {context: ., dockerfile: services/northbound_api_gateway/Dockerfile}
    image: qsdn-northbound-api-gateway
    environment: {SERVICE_NAME: northbound_api_gateway}
    ports: ["8080:8080"]
    depends_on: [identity-auth, audit-log]

  identity-auth:
    build: {context: ., dockerfile: services/identity_auth/Dockerfile}
    image: qsdn-identity-auth
    environment: {SERVICE_NAME: identity_auth}
    volumes: ["./config:/app/config:ro"]
    depends_on: [topology-manager, audit-log]

  topology-manager:
    build: {context: ., dockerfile: services/topology_manager/Dockerfile}
    image: qsdn-topology-manager
    environment:
      SERVICE_NAME: topology_manager
      # static = topologia dal file YAML (default, per la demo).
      # onos   = topologia scoperta da ONOS (su hardware x86: export TOPOLOGY_SOURCE=onos)
      TOPOLOGY_SOURCE: ${TOPOLOGY_SOURCE:-static}
      # On macOS ONOS runs in a Linux VM: set ONOS_BASE_URL=http://<VM_IP>:8181
      ONOS_BASE_URL: ${ONOS_BASE_URL:-http://onos:8181}
      ONOS_USER: onos
      ONOS_PASSWORD: rocks
      ONOS_MAPPING: /app/config/onos_mapping.yaml
    volumes: ["./config:/app/config:ro"]
    ports: ["8082:8082"]
    depends_on: [path-computation-engine, audit-log]

  path-computation-engine:
    build: {context: ., dockerfile: services/path_computation_engine/Dockerfile}
    image: qsdn-path-computation-engine
    environment: {SERVICE_NAME: path_computation_engine}
    depends_on: [key-orchestration-manager, audit-log]

  key-orchestration-manager:
    build: {context: ., dockerfile: services/key_orchestration_manager/Dockerfile}
    image: qsdn-key-orchestration-manager
    environment:
      SERVICE_NAME: key_orchestration_manager
      # switch to the hybrid registry for the real Next Door pair:
      #   KMS_REGISTRY=/app/config/kms_registry.ndks.yaml
      KMS_REGISTRY: ${KMS_REGISTRY:-/app/config/kms_registry.yaml}
    volumes:
      - "./config:/app/config:ro"
      - "./ndks/certs:/app/certs:ro"     # SAE client certs for ndks backends
    depends_on: [service-provisioning, audit-log]

  service-provisioning:
    build: {context: ., dockerfile: services/service_provisioning/Dockerfile}
    image: qsdn-service-provisioning
    environment: {SERVICE_NAME: service_provisioning}
    depends_on: [audit-log]

  # ---- Lower layer: simulated KMS (ETSI GS QKD 014), one per city ----
  # Every KMS has its own build block (same image) so Compose builds them
  # locally instead of trying to pull qsdn-kms-mock from a registry.
  kms-milano:
    build: {context: ., dockerfile: services/kms_mock/Dockerfile}
    image: qsdn-kms-mock
    environment: {CITY: milano, SAE_ID: milano-sae, PORT: "9001"}
    ports: ["9001:9001"]
  kms-torino:
