    environment: {CITY: napoli, SAE_ID: napoli-sae, PORT: "9008"}
    ports: ["9008:9008"]

  # Trusted relay nodes, added to satisfy QKD fibre-distance constraints
  # between the 5 main cities (see config/topology.yaml).
  kms-parma:
    build: {context: ., dockerfile: services/kms_mock/Dockerfile}
