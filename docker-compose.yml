    environment: {CITY: verona, SAE_ID: verona-sae, PORT: "9014"}
    ports: ["9014:9014"]

  # ---- Real ETSI 014 KMEs (Next Door, PATCHED for full mesh), profile "ndks" ----
  # All 14 nodes (9 main KMS + 5 trusted relay: parma/la_spezia/padova/pavia/ferrara) are real
  # KMEs in FULL MESH: any pair exchanges real keys, relays included.
  # The image is built from ndks/ (upstream + scanner/broadcaster patch).
  # Start with:  ./ndks/generate_certs.sh
  #   KMS_REGISTRY=/app/config/kms_registry.ndks.yaml docker compose --profile ndks up -d --build
  kme-milano:
    build: {context: ./ndks}
    image: qsdn-ndks-patched-milano
    profiles: ["ndks"]
    environment:
      PORT: "8011"
      KME_ID: "10000000-0000-0000-0000-000000000001"
      ATTACHED_SAE_ID: "5ae00000-0000-0000-0000-000000000001"
      OTHER_KMES: "https://kme-torino:8012,https://kme-genova:8013,https://kme-venezia:8014,https://kme-bologna:8015,https://kme-firenze:8016,https://kme-roma:8017,https://kme-napoli:8018,https://kme-parma:8019,https://kme-la_spezia:8020,https://kme-padova:8021,https://kme-pavia:8022,https://kme-ferrara:8023,https://kme-verona:8024"
      DEFAULT_KEY_SIZE: "32"
      MAX_KEY_COUNT: "100000"
      MAX_KEYS_PER_REQUEST: "128"
      MAX_KEY_SIZE: "1024"
      MIN_KEY_SIZE: "32"
      KEY_GEN_SEC_TO_GEN: "2"
      SCANNER_TIMEOUT: "5"
      BROADCAST_TIMEOUT: "5"
      CA_FILE: /certs/ca.crt.pem
      KME_CERT: /certs/kme-milano.crt.pem
      KME_KEY: /certs/kme-milano.key.pem
      SAE_CERT: /certs/sae-milano.crt.pem
