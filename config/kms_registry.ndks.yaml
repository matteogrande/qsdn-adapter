# FULL-MESH real backend: ALL cities are Next Door KMEs (patched image,
# see ndks/). Any pair of endpoints exchanges REAL keys via ETSI 014 + mTLS.
# Use with:  ./ndks/generate_certs.sh
#   KMS_REGISTRY=/app/config/kms_registry.ndks.yaml docker compose --profile ndks up -d --build
kms:
  milano:
    label: "Milano KMS"
    backend: ndks
    base_url: "https://kme-milano:8011"
    sae_id: "5ae00000-0000-0000-0000-000000000001"
    sae_cert: "/app/certs/sae-milano.crt.pem"
    sae_key:  "/app/certs/sae-milano.key.pem"
